<div class="auth-container">
  <div class="auth-box">
    <h2>Chess Learning Registration</h2>
    
    @if (error) {
      <div class="error-msg">{{ error }}</div>
    }

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="displayName">Display Name</label>
        <input id="displayName" type="text" formControlName="displayName" placeholder="Enter your display name" />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="Enter your email" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" placeholder="Create a password" />
      </div>

      <button type="submit" [disabled]="registerForm.invalid">Register</button>
    </form>

    <div class="links">
      Already have an account? <a routerLink="/login">Login</a>
    </div>
  </div>
</div>
