<div class="container">
  <h2>User Management</h2>
  <table class="data-table">
    <thead>
      <tr>
        <th>Display Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Status</th>
        <th>Created At</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (user of users(); track user.id) {
        <tr>
          <td>{{ user.displayName }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.role }}</td>
          <td>
            <span class="badge" [class.active]="user.isActive" [class.inactive]="!user.isActive">
              {{ user.isActive ? 'Active' : 'Inactive' }}
            </span>
          </td>
          <td>{{ user.createdAt | date }}</td>
          <td>
            <button [routerLink]="['/users', user.id]">Details</button>
            <button [routerLink]="['/users', user.id, 'audit']">Audit Log</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
