version: '3.8'

services:
  db:
    platform: linux/amd64
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password123!
    ports:
      - "1433:1433"
    networks:
      - chess-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Password123!", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=ChessLearningDb;User Id=sa;Password=Password123!;TrustServerCertificate=True;MultipleActiveResultSets=true
    ports:
      - "5200:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - chess-network

  frontend:
    # platform: linux/amd64
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "4200:80"
    networks:
      - chess-network

networks:
  chess-network:
    driver: bridge
